services:
  db:
    image: postgres:15-alpine
    container_name: ubak_db_dev
    restart: always
    env_file: ./backend/.env
    environment:
      POSTGRES_USER: postubak
      POSTGRES_PASSWORD: postubak123
      POSTGRES_DB: ubak_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postubak -d ubak_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: ubak_pgadmin_dev
    restart: always
    env_file: ./backend/.env
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ubak.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  backend:
    build: ./backend
    container_name: ubak_backend_dev
    restart: always
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postubak:postubak123@db:5432/ubak_db
      SECRET_KEY: a_very_secret_key_change_me_in_production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8000:8800"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
